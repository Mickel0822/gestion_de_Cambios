[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: flake8-bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Los tests pueden usar imports y patrones menos estrictos
"tests/*" = ["E501"]
