services:
  - type: web
    name: analyticore-java
    runtime: docker
    plan: free
    rootDir: java-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: analyticore-db
          property: connectionString
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: PORT
        value: 8080
      - key: WORKER_THREADS
        value: 2
      - key: WORKER_QUEUE_CAPACITY
        value: 50

  - type: web
    name: analyticore-python
    runtime: docker
    plan: free
    rootDir: python-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: analyticore-db
          property: connectionString
      - key: JAVA_SERVICE_URL
        fromService:
          type: web
          name: analyticore-java
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: INTERNAL_API_KEY
        fromService:
          type: web
          name: analyticore-java
          envVarKey: INTERNAL_API_KEY
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: analyticore-frontend
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: MAX_TEXT_LENGTH
        value: 5000
      - key: MAX_REQUEST_BYTES
        value: 65536
      - key: NOTIFY_MAX_ATTEMPTS
        value: 5
      - key: NOTIFY_TIMEOUT_SECONDS
        value: 12
      - key: RETRY_AFTER_SECONDS
        value: 120
      - key: WEB_CONCURRENCY
        value: 2
      - key: GUNICORN_TIMEOUT_SECONDS
        value: 180

  - type: web
    name: analyticore-frontend
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: analyticore-python
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: VITE_MAX_TEXT_LENGTH
        value: 5000
      - key: VITE_RETRY_AFTER_SECONDS
        value: 120
      - key: PORT
        value: 8080

databases:
  - name: analyticore-db
    plan: free
    databaseName: analyticore
    user: analyticore
